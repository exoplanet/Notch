name: Owner pull requests only

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  close-others:
    if: github.event.pull_request.user.login != 'exoplanet'
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR" --repo "${{ github.repository }}" \
            --comment "This repository accepts pull requests from exoplanet only. The source and the latest release stay public."
